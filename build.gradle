plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    // Ваши текущие зависимости
    testImplementation (
            "com.codeborne:selenide:6.0.3",
            "org.junit.jupiter:junit-jupiter-api:5.8.1")
    testRuntimeOnly (
            "org.junit.jupiter:junit-jupiter-engine:5.8.1",
            "org.slf4j:slf4j-simple:1.7.30")
    
    // Добавляем Allure annotations
    testImplementation 'io.qameta.allure:allure-java-commons:2.17.3'
}

test {
    useJUnitPlatform()
}
